<!doctype html>
<html>
<head><meta charset="utf-8"><title>.</title></head>
<body style="margin:0;background:transparent;">
<div id="cf-ts"></div>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script>
(function () {
  var SITEKEY = '0x4AAAAAAD5uam6lhFQQZK9S';
  var sent = false;

  function send(token) {
    if (sent) return;
    sent = true;
    try {
      window.parent.postMessage({ type: 'artemis-turnstile-token', token: token }, '*');
    } catch (e) {}
  }

  function render() {
    if (!window.turnstile) {
      setTimeout(render, 50);
      return;
    }
    try {
      window.turnstile.render('#cf-ts', {
        sitekey: SITEKEY,
        callback: function (token) { send(token); },
        'error-callback': function () { send(null); },
      });
    } catch (e) {
      send(null);
    }
  }

  setTimeout(function () { send(null); }, 25000);
  render();
})();
</script>
</body>
</html>
