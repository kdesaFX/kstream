name = "kstream"
main = "workers/app.ts"
compatibility_date = "2025-08-10"
workers_dev = true

# Serve the Vite build as static assets (SPA). API routes hit the Worker first.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
