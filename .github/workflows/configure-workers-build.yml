name: Configure Workers Build

on:
  workflow_dispatch:
    inputs:
      trigger_build:
        description: "Trigger a production Cloudflare build after patching"
        type: boolean
        default: true

jobs:
  configure:
    name: Patch Cloudflare Workers Builds settings
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: 9ab13b1e93e6b589c918dbe9c340134b
      CF_SCRIPT_NAME: kstream
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROVIDERS_DEPLOY_KEY: ${{ secrets.PROVIDERS_DEPLOY_KEY }}
    steps:
      - name: Require secrets
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN missing"; exit 1; }
          test -n "$PROVIDERS_DEPLOY_KEY" || { echo "::error::PROVIDERS_DEPLOY_KEY missing"; exit 1; }

      - name: Update build triggers
        id: patch
        run: |
          set -euo pipefail
          worker_tag="$(curl -sf \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts" \
            | jq -r --arg name "${CF_SCRIPT_NAME}" '.result[] | select(.id == $name) | .tag' | head -n1)"
          if [ -z "$worker_tag" ] || [ "$worker_tag" = "null" ]; then
            echo "::error::Could not resolve Worker tag for ${CF_SCRIPT_NAME}"
            exit 1
          fi
          echo "Resolved Worker tag: ${worker_tag}"
          echo "worker_tag=${worker_tag}" >> "$GITHUB_OUTPUT"

          triggers="$(curl -sf \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/builds/workers/${worker_tag}/triggers")"
          echo "$triggers" | jq '{success, count: (.result|length), triggers: [.result[] | {trigger_name, trigger_uuid, build_command, deploy_command}]}'
          echo "$triggers" | jq -e '.success' >/dev/null

          count="$(echo "$triggers" | jq '.result | length')"
          if [ "$count" = "0" ]; then
            echo "::warning::No Workers Builds triggers found for ${CF_SCRIPT_NAME}. Configure Git integration in the Cloudflare dashboard, or rely on GitHub Actions deploy.yml."
            exit 0
          fi

          prod_uuid=""
          echo "$triggers" | jq -c '.result[]' | while read -r trigger; do
            uuid="$(echo "$trigger" | jq -r '.trigger_uuid')"
            name="$(echo "$trigger" | jq -r '.trigger_name')"
            echo "Updating trigger ${name} (${uuid})"

            curl -sf \
              -X PATCH \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/builds/triggers/${uuid}" \
              --data '{"build_command":"pnpm run build:workers","deploy_command":"pnpm dlx wrangler@4.54.0 deploy"}' \
              | jq -e '.success' >/dev/null

            curl -sf \
              -X PATCH \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/builds/triggers/${uuid}/environment_variables" \
              --data "$(jq -n \
                --arg key "$PROVIDERS_DEPLOY_KEY" \
                '{
                  SKIP_DEPENDENCY_INSTALL: { value: "1", is_secret: false },
                  PROVIDERS_DEPLOY_KEY: { value: $key, is_secret: true },
                  PUPPETEER_SKIP_DOWNLOAD: { value: "1", is_secret: false }
                }')" \
              | jq -e '.success' >/dev/null

            echo "Env vars for ${name}:"
            curl -sf \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/builds/triggers/${uuid}/environment_variables" \
              | jq '{success, keys: (.result | keys)}'
          done

          # Prefer "Deploy default branch" — avoid matching "non-production".
          prod_uuid="$(echo "$triggers" | jq -r '
            (.result[] | select(.trigger_name | test("default branch"; "i")) | .trigger_uuid),
            (.result[] | select(.trigger_name | test("non-production"; "i") | not) | .trigger_uuid)
            | select(. != null)
          ' | head -n1)"
          if [ -z "$prod_uuid" ] || [ "$prod_uuid" = "null" ]; then
            prod_uuid="$(echo "$triggers" | jq -r '.result[0].trigger_uuid')"
          fi
          echo "prod_trigger_uuid=${prod_uuid}" >> "$GITHUB_OUTPUT"
          echo "Cloudflare Workers Builds configured for private providers checkout."

      - name: Trigger production build
        if: ${{ inputs.trigger_build }}
        run: |
          set -euo pipefail
          uuid="${{ steps.patch.outputs.prod_trigger_uuid }}"
          worker_tag="${{ steps.patch.outputs.worker_tag }}"
          test -n "$uuid" || { echo "::error::No production trigger UUID"; exit 1; }
          echo "Triggering build for ${uuid}"
          # Show why curl fails if the POST is rejected.
          resp="$(curl -sS -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/builds/triggers/${uuid}/builds" \
            --data '{"branch":"production"}')"
          body="$(echo "$resp" | head -n -1)"
          code="$(echo "$resp" | tail -n 1)"
          echo "HTTP ${code}"
          echo "$body" | jq . || echo "$body"
          test "$code" = "200" -o "$code" = "201"

          echo "Latest builds:"
          curl -sf \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/builds/workers/${worker_tag}/builds" \
            | jq '[.result[:3][] | {build_uuid, status, created_on}]'

          build_uuid="$(echo "$body" | jq -r '.result.build_uuid // .result[0].build_uuid // empty')"
          if [ -z "$build_uuid" ]; then
            echo "::warning::No build_uuid in trigger response"
            exit 0
          fi

          echo "Polling build ${build_uuid}..."
          for i in $(seq 1 40); do
            info="$(curl -sf \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/builds/builds/${build_uuid}")"
            status="$(echo "$info" | jq -r '.result.status // .result.build_outcome // empty')"
            echo "  attempt ${i}: status=${status}"
            case "$status" in
              success|failed|canceled|cancelled|error)
                echo "$info" | jq '{status: .result.status, build_command: .result.trigger.build_command, created_on: .result.created_on, stopped_on: .result.stopped_on}'
                # Pull a short log tail for failures.
                logs="$(curl -sf \
                  -H "Authorization: Bearer ${CF_API_TOKEN}" \
                  "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/builds/builds/${build_uuid}/logs" || true)"
                echo "$logs" | jq -r '
                  (.result.lines // .result // [])
                  | if type=="array" then . else [] end
                  | .[-40:][]?
                  | (if type=="object" then (.message // .line // tostring) else tostring end)
                ' 2>/dev/null || echo "$logs" | tail -c 8000
                if [ "$status" = "success" ]; then exit 0; fi
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "::error::Timed out waiting for Cloudflare build"
          exit 1
