name: Linting and Testing

on:
  push:
    branches:
      - master
      - production
  pull_request:

jobs:
  linting:
    name: Run Linters
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Auth private GitHub deps
        env:
          PROVIDERS_READ_TOKEN: ${{ secrets.PROVIDERS_READ_TOKEN }}
        run: |
          if [ -z "$PROVIDERS_READ_TOKEN" ]; then
            echo "::error::PROVIDERS_READ_TOKEN secret required for private providers"
            exit 1
          fi
          printf 'machine github.com\nlogin x-access-token\npassword %s\n\nmachine codeload.github.com\nlogin x-access-token\npassword %s\n' \
            "$PROVIDERS_READ_TOKEN" "$PROVIDERS_READ_TOKEN" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"

      - name: Install pnpm packages
        run: pnpm install

      - name: Run ESLint
        run: pnpm run lint

  docker:
    name: Build Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          push: false
          context: .
