name: Linting and Testing

on:
  push:
    branches:
      - master
      - production
  pull_request:

jobs:
  linting:
    name: Run Linters
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Checkout providers
        uses: actions/checkout@v4
        with:
          repository: kdesaFX/providers
          ref: production
          ssh-key: ${{ secrets.PROVIDERS_DEPLOY_KEY }}
          path: .providers-src

      - name: Wire local providers
        run: |
          cd .providers-src
          pnpm install
          pnpm run build
          cd -
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.dependencies['@p-stream/providers'] = 'file:./.providers-src';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          rm -f pnpm-lock.yaml
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"

      - name: Install pnpm packages
        run: pnpm install
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"

      - name: Run ESLint
        run: pnpm run lint

  docker:
    name: Build Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Checkout providers
        uses: actions/checkout@v4
        with:
          repository: kdesaFX/providers
          ref: production
          ssh-key: ${{ secrets.PROVIDERS_DEPLOY_KEY }}
          path: .providers-src

      - name: Wire local providers for Docker context
        run: |
          cd .providers-src
          pnpm install
          pnpm run build
          cd -
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.dependencies['@p-stream/providers'] = 'file:./.providers-src';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          rm -f pnpm-lock.yaml
          pnpm install
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          push: false
          context: .
