name: Deploy

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build providers from source
        run: |
          git clone --depth 1 --branch production https://github.com/kdesaFX/providers.git /tmp/providers
          cd /tmp/providers
          pnpm install
          pnpm run build
          cd -
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.dependencies['@p-stream/providers'] = 'file:/tmp/providers';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          rm -f pnpm-lock.yaml
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"

      - name: Install
        run: pnpm install
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"

      - name: Build
        run: pnpm run build
        env:
          # Runtime config still comes from public/config.js; these only fill
          # build-time fallbacks when a secret/var is present.
          VITE_TMDB_READ_API_KEY: ${{ secrets.VITE_TMDB_READ_API_KEY || 'placeholder' }}
          VITE_SHOW_SUPPORT_BAR: "true"
          VITE_ALLOW_FEBBOX_KEY: "true"
          VITE_TRAKT_CLIENT_ID: ${{ secrets.VITE_TRAKT_CLIENT_ID }}
          VITE_TRAKT_CLIENT_SECRET: ${{ secrets.VITE_TRAKT_CLIENT_SECRET }}
          VITE_TRAKT_REDIRECT_URI: ${{ secrets.VITE_TRAKT_REDIRECT_URI }}
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder' }}
          VITE_ENABLE_HOME_AD: "false"
          VITE_ENABLE_SECONDARY_AD: "false"
          VITE_ENABLE_BOOKMARKS_AD: "false"
          VITE_PRIMARY_BANNER_GIF: "false"
          VITE_ENABLE_POPUNDER: "false"
          VITE_ENABLE_RYBBIT: ${{ vars.VITE_ENABLE_RYBBIT || 'false' }}
          VITE_RYBBIT_SCRIPT_URL: ${{ vars.VITE_RYBBIT_SCRIPT_URL }}
          VITE_RYBBIT_SITE_ID: ${{ vars.VITE_RYBBIT_SITE_ID }}
          VITE_USE_SIMKL: ${{ vars.VITE_USE_SIMKL || 'false' }}
          VITE_SIMKL_CLIENT_ID: ${{ vars.VITE_SIMKL_CLIENT_ID }}
          VITE_SIMKL_CLIENT_SECRET: ${{ secrets.VITE_SIMKL_CLIENT_SECRET }}
          VITE_SIMKL_REDIRECT_URI: ${{ vars.VITE_SIMKL_REDIRECT_URI }}
          VITE_DMCA_EMAIL: ${{ vars.VITE_DMCA_EMAIL }}
          VITE_APP_DOMAIN: ${{ vars.VITE_APP_DOMAIN || 'https://kdesa.stream' }}
          VITE_CORS_PROXY_URL: /api/proxy
          VITE_M3U8_PROXY_URL: /api
          VITE_HAS_ONBOARDING: "true"
          VITE_NORMAL_ROUTER: "true"

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.54.0"
          command: deploy

      - name: Purge Cloudflare cache
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo "Cloudflare purge skipped (CLOUDFLARE_ZONE_ID not set)"
            exit 0
          fi
          curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
          echo "Cloudflare cache purged"
